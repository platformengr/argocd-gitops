# Shared by every environment; overlays change only what differs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: app
          image: ghcr.io/stefanprodan/podinfo:6.7.0
          ports:
            - containerPort: 9898
          env:
            - name: PODINFO_UI_MESSAGE
              value: checkout (dev)
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
