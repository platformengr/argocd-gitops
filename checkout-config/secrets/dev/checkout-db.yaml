# The database password for checkout-dev. The value lives in team-checkout's
# store as Secret db-dev; External Secrets copies it into Secret checkout-db.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: checkout-db
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: checkout }
  target: { name: checkout-db }        # the Secret the chart reads
  data:
    - secretKey: password
      remoteRef: { key: db-dev, property: password }   # Secret db-dev in store-checkout
