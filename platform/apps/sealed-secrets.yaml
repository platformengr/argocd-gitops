# Sealed Secrets: encrypt a Secret with the cluster's public key, commit the
# result. Only the controller in this cluster can decrypt it (module 08).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0
    helm:
      valuesObject:
        fullnameOverride: sealed-secrets-controller   # the name kubeseal looks for
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false     # the controller holds the only decryption key
      selfHeal: true
