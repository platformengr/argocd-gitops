# The secret stores: one per team, each readable only from that team's
# namespaces (module 08). Synced after the External Secrets CRDs exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-store
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/argocd-platform.git
    targetRevision: main
    path: secret-store
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false     # a store namespace holds the values: never auto-delete it
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true   # the CRDs may still be installing
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
