# Sealed repository credentials (secrets/*.yaml). Synced after the Sealed
# Secrets controller exists, so it can unseal them into argocd Secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: repo-credentials
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/argocd-platform.git
    targetRevision: main
    path: secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
