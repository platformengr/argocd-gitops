# Repository credentials (secrets/*.yaml): ExternalSecrets that build the
# Argo CD repository Secrets from the platform store. Git holds no key.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: repo-credentials
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/argocd-platform.git
    targetRevision: main
    path: secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true   # the CRDs may still be installing
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
