# Argo CD's read-only deploy key for checkout-config. The key lives in the
# platform store; this file says where to find it and what Secret to build.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-checkout-config
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: platform }
  target:
    name: repo-checkout-config
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository   # how Argo CD finds it
      data:
        type: git
        url: git@github.com:YOUR_GITHUB_USER/checkout-config.git
        sshPrivateKey: "{{ .sshPrivateKey }}"
  data:
    - secretKey: sshPrivateKey
      remoteRef: { key: repo-checkout-config, property: sshPrivateKey }
